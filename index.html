          {
            "@type": "SoftwareApplication",
            "name": "Fideliapp",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Software de fidelización de clientes",

            "description": "App de fidelización de clientes y programa de puntos para negocios locales: QR por venta, monedas, recompensas, campañas, equipo con permisos y control de presupuesto.",
            "featureList": [
              "Programa de puntos con QR único por venta",
              "Tarjeta de fidelización digital en el celular",
              "Recompensas y carta configurables",
              "Campañas con multiplicador o bono",
              "Encargados con permisos para ventas y canjes",
              "Control de presupuesto y alertas",
              "Vencimiento de monedas",
              "Auditoría e historial por cliente",
              "Multiempresa"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Qué es Fideliapp?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Fideliapp es un software de fidelización de clientes para negocios locales. Permite crear un programa de puntos en el que tus clientes acumulan monedas con cada compra escaneando un QR y las canjean por recompensas que tú defines, todo desde el celular."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cómo funciona el sistema de puntos para clientes?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "El encargado registra la venta y la app genera un QR. El cliente lo escanea y recibe monedas según tus reglas. Cuando junta suficientes monedas solicita una recompensa, tu equipo aprueba el canje y entrega el premio."
                }
              },
              {
                "@type": "Question",
                "name": "¿Mis clientes tienen que descargar una app?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No es obligatorio. Fideliapp funciona desde el navegador del celular y además se puede instalar como app desde la misma página, sin pasar por una tienda de aplicaciones."
                }
              },
              {
                "@type": "Question",
                "name": "¿Necesito un lector, una impresora o integrar mi sistema POS?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Basta con el celular o la tablet del negocio para generar los QR de venta y aprobar canjes. No se requiere hardware adicional ni integración con tu caja."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo controlar cuánto me cuestan las recompensas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Defines el costo en monedas de cada premio, límites de canje por cliente y periodo, y un presupuesto. El panel económico te muestra el gasto y te alerta antes de superarlo."
                }
              },
              {
                "@type": "Question",
                "name": "¿Mis empleados pueden usarlo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Puedes agregar encargados con permisos para registrar ventas y aprobar canjes. Cada operación queda registrada en la auditoría con el usuario que la hizo."
                }
              },
              {
                "@type": "Question",
                "name": "¿Las monedas vencen?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tú decides la vigencia en la configuración del programa. Cuando hay vencimiento, se consumen primero las monedas más antiguas y cada vencimiento queda registrado en el historial de movimientos."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo administrar varios negocios con la misma cuenta?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Fideliapp es multiempresa: puedes registrar varios negocios y cada uno tiene su propio programa, carta, recompensas y equipo."
                }
              }
            ]
          }
